services:
  hyde:
    image: node:latest
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - 127.0.0.1:8080:8080
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.5
          memory: 256M
    command: node --env-file=.env hyde.js
networks: {}