services:
  hyde:
    image: node:latest
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - ${DOCKER_HOST}:${DOCKER_PORT}:${HAWK_PORT}
    deploy:
      resources:
        limits:
          cpus: ${DOCKER_CPU_MAX}
          memory: ${DOCKER_RAM_MAX}
        reservations:
          cpus: ${DOCKER_CPU_MIN}
          memory: ${DOCKER_RAM_MIN}
    command: node --env-file=.env hyde.js
networks: {}